[package]
name = "cap-tokio"
version = "4.0.2"
description = "Capability-based version of tokio"
authors = [
    "Dan Gohman <dev@sunfishcode.online>",
    "Jakub Konka <kubkon@jakubkonka.com>",
]
license = "Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT"
keywords = ["network", "file", "async", "future", "await"]
categories = ["filesystem", "network-programming", "asynchronous", "concurrency"]
repository = "https://github.com/bytecodealliance/cap-std"
edition = "2021"

[dependencies]
arf-strings = { version = "0.7.0", optional = true }
futures-core = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "rt", "net"] }
cap-primitives = { path = "../cap-primitives", version = "^4.0.2" }
io-lifetimes = { version = "2.0.0", default-features = false }
io-extras = { version = "0.18.3", features = ["tokio"] }
socket2 = { version = "0.5" }
camino = { version = "1.0.5", optional = true }

[target.'cfg(not(windows))'.dependencies]
rustix = { version = "1.0.0", features = ["fs"] }

[features]
default = []
fs_utf8 = ["camino"]
arf_strings = ["fs_utf8", "arf-strings"]
